{% extends "base.html" %}

{% block title %}Sign In - ShopZone{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your ShopZone account to manage orders</p>
    </div>

    <!-- Quick Demo Accounts Autofill Helper -->
    <div style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem; font-size: 0.825rem;">
      <div style="font-weight: 700; color: var(--dark); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.35rem;">
        <i class="bi bi-key-fill" style="color: var(--primary);"></i> Quick Demo Logins:
      </div>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('admin@shopzone.com', 'admin123')" style="font-size: 0.775rem;">
          <i class="bi bi-shield-lock"></i> Fill Admin
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('john@example.com', 'user123')" style="font-size: 0.775rem;">
          <i class="bi bi-person"></i> Fill Customer
        </button>
      </div>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=next) }}">
      <div class="form-group">
        <label class="form-label" for="login_id">Username or Email *</label>
        <input type="text" id="login_id" name="login_id" class="form-control" required
               placeholder="username or user@example.com"
               value="{{ login_id or '' }}" autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password *</label>
        </div>
        <input type="password" id="password" name="password" class="form-control" required
               placeholder="••••••••">
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Don't have an account yet? <a href="{{ url_for('auth.register') }}">Create one here</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillCredentials(id, pass) {
  document.getElementById('login_id').value = id;
  document.getElementById('password').value = pass;
  showToast('Credentials filled! Click Sign In.', 'info');
}
</script>
{% endblock %}
