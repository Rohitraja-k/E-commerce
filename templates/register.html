{% extends "base.html" %}

{% block title %}Create an Account - ShopZone{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 480px;">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Your Account</h2>
      <p>Join ShopZone for seamless shopping and order tracking</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name *</label>
        <input type="text" id="full_name" name="full_name" class="form-control" required
               placeholder="Jane Doe" value="{{ full_name or '' }}" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username *</label>
        <input type="text" id="username" name="username" class="form-control" required
               placeholder="janedoe99" value="{{ username or '' }}">
        <span style="font-size: 0.775rem; color: var(--secondary);">3–30 characters, letters, numbers, or underscore</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" name="email" class="form-control" required
               placeholder="jane@example.com" value="{{ email or '' }}">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" required
                 placeholder="At least 6 chars">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" required
                 placeholder="Repeat password">
        </div>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="bi bi-person-check-fill"></i> Register Account
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
